<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;} body{margin:0;background:#FBF7EF;}</style>
</helmet>
<div style="font-family: 'Manrope', sans-serif; color: #15292E; background: #FBF7EF;">
  <dc-import name="Nav" active="gallery" hint-size="100%,86px"></dc-import>

  <section style="position: relative; padding: clamp(80px, 11vw, 150px) clamp(20px, 5vw, 64px) clamp(60px, 8vw, 110px); background: linear-gradient(120deg,#0C3B45,#2E96A8); overflow: hidden;">
    <img src="https://images.unsplash.com/photo-1505228395891-9a51e7e86bf6?auto=format&fit=crop&w=2000&q=80" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.30;">
    <div style="position: relative; z-index: 2; max-width: 1240px; margin: 0 auto;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: #BFE0E5; margin-bottom: 18px;">Атмосфера</div>
      <h1 style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(44px, 7vw, 84px); line-height: 1; color: #FBF7EF; margin: 0;">Галерея</h1>
      <p style="font-size: 17px; line-height: 1.7; color: #E4EEEF; max-width: 520px; margin: 22px 0 0;">Свет, вода и тёплый песок. Так выглядят дни в «Лагуне».</p>
    </div>
  </section>

  <section style="max-width: 1280px; margin: 0 auto; padding: clamp(50px, 7vw, 90px) clamp(20px, 5vw, 64px);">
    <div style="columns: 3; column-gap: 18px;">
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
      <div style="break-inside: avoid; margin-bottom: 18px; border-radius: 16px; overflow: hidden;"><img src="https://images.unsplash.com/photo-1551918120-9739cb430c6d?auto=format&fit=crop&w=800&q=80" alt="" style="width:100%;display:block;"></div>
    </div>
  </section>

  <section style="background: #0C3B45; padding: clamp(60px, 8vw, 100px) clamp(20px, 5vw, 64px); text-align: center;">
    <h2 style="font-family: 'Cormorant Garamond', serif; font-size: clamp(30px, 4.5vw, 52px); font-weight: 500; color: #FBF7EF; margin: 0 0 24px;">Хотите увидеть вживую?</h2>
    <a href="contacts.dc.html" style="display: inline-flex; padding: 15px 34px; border-radius: 999px; background: #EBD6A8; color: #0C3B45; font-size: 15px; font-weight: 700; text-decoration: none;" style-hover="background: #FBF7EF;">Забронировать визит</a>
  </section>

  <dc-import name="Footer" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
